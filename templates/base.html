<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}نظام تصنيف الصور{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --muted:#9aa3b2; --acc:#4f8cff; --ok:#2ecc71; --warn:#f5a623; --bad:#e74c3c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif;line-height:1.7}
  header{background:linear-gradient(90deg,#1b2436,#151a24);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  header h1{font-size:19px;margin:0}
  header nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:15px}
  header nav a:hover,header nav a.active{background:var(--card2);color:var(--txt)}
  main{max-width:1100px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:15px;margin:16px 0 8px;color:var(--muted);font-weight:600}
  .muted{color:var(--muted);font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  th{color:var(--muted);font-weight:600}
  .grid{display:grid;gap:14px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kv div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kv span{display:block;color:var(--muted);font-size:12px}
  .kv b{font-size:17px;font-weight:600}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .accept{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid rgba(46,204,113,.4)}
  .review{background:rgba(245,166,35,.15);color:var(--warn);border:1px solid rgba(245,166,35,.4)}
  .error{background:rgba(231,76,60,.15);color:var(--bad);border:1px solid rgba(231,76,60,.4)}
  button,.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  input[type=file],input[type=number]{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px;width:100%;font-family:inherit}
  label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:200px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .thumb{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .thumb img{width:100%;height:190px;object-fit:cover;background:#000;display:block}
  .thumb .body{padding:10px 12px}
  .bar{height:7px;border-radius:99px;background:#2b3140;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .probs{margin-top:8px;font-size:12px;color:var(--muted)}
  .alert{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.35);color:#ffd7d2;padding:10px 14px;border-radius:10px;margin-bottom:14px}
  .ok{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.35);color:#cdf3dd;padding:10px 14px;border-radius:10px;margin-bottom:14px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .actions button{padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>📷 نظام تصنيف الصور</h1>
  <nav>
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">التنبؤ</a>
    <a href="{{ url_for('review') }}" class="{% if request.endpoint in ['review','label_row'] %}active{% endif %}">
      المراجعة {% if pending %}<span class="badge review">{{ pending }}</span>{% endif %}</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
